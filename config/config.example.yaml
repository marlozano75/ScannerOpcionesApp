# Copiar a config/config.yaml y ajustar. Ningún valor de negocio está en el código.
ibkr:
  host: 127.0.0.1
  ports: { live: 7496, paper: 7497 }
  client_id: 1
  accounts: { live: null, paper: null }   # id por modo (U1234567); imprescindible si TWS gestiona varias cuentas
  auto_detect_mode: true   # al arrancar elige live/paper según el puerto que responda (7496/7497); false = usa `mode`
  mode: paper            # paper | live
  what_if_timeout_seconds: 15   # tiempo máximo de un what-if de margen (si TWS pierde la conexión con IBKR no responde nunca)
  market_data_type: 2    # 1 = live, 2 = congelado (live; con el mercado cerrado, el último bid/ask del cierre), 3 = diferido
                         # (3 no ocupa la suscripción en tiempo real: la app móvil de IBKR conserva sus datos en vivo)
  delayed_minutes: 15    # retraso de los datos diferidos (solo con market_data_type 3 o 4)

refresh:
  interval_minutes: 5    # con datos diferidos se usa como mínimo delayed_minutes (no hay datos nuevos antes)
  batch_size: 50             # contratos por petición de cotizaciones a IBKR (también en el respaldo; con tastytrade manda market_data.quote_batch_size)
  account_interval_minutes: 1   # cada cuánto se refrescan cuenta, posiciones y VIX, aparte del ciclo de mercado
  margin_max_age_minutes: 60   # reutiliza el margen (what-if) guardado hasta esta edad

daily_update:
  run_on_startup: true   # sin hora fija (Q-09); se ejecuta en segundo plano tras el primer refresco
  concurrency: 4         # tickers que se actualizan a la vez

scanner:
  quality:                 # opciones del bloque «Calidad de la empresa» del scanner
    liquidity_options: [2, 3, 4]            # liquidez mínima de las opciones (1-5, de tastytrade)
    positive_quarters_options: [2, 3, 4]    # trimestres con beneficios exigidos de los últimos 4
    refresh_days: 7                         # cada cuántos días se baja de nuevo el historial trimestral
    leverage_options: [1, 2, 3, 5]          # pasivo/patrimonio máximo ofrecido (los sectores exentos no se miden)
    # Filtros de solvencia del Universo con TRES GRADOS de exigencia (flexible, estándar, estricto); el umbral de cada grado:
    thresholds:
      debt_to_equity:     {flexible: 1.5,  standard: 1.0,  strict: 0.5}    # deuda financiera / patrimonio, máximo
      interest_coverage:  {flexible: 2.0,  standard: 3.0,  strict: 5.0}    # resultado operativo / intereses, mínimo (veces)
      cash_to_short_debt: {flexible: 0.5,  standard: 1.0,  strict: 2.0}    # efectivo / deuda a corto plazo, mínimo (veces)
      ocf_to_debt:        {flexible: 0.15, standard: 0.30, strict: 0.50}   # flujo operativo / deuda total, mínimo
      capex_to_ocf:       {flexible: 0.60, standard: 0.35, strict: 0.20}   # inversión / flujo operativo, máximo
      fcf_to_assets:      {flexible: 0.04, standard: 0.08, strict: 0.12}   # flujo de caja libre / activos, mínimo
      net_buyback_pct:    {flexible: 0.0,  standard: 1.0,  strict: 2.0}    # reducción del nº de acciones (%), mínimo
      roic:               {flexible: 0.08, standard: 0.12, strict: 0.20}   # ROIC = resultado operativo tras impuestos / (deuda + patrimonio), mínimo (SUPOSICIÓN: el vídeo no da umbral)
      loss_years:         {flexible: 2,    standard: 1,    strict: 0}      # años con pérdidas de los últimos 10 años fiscales, máximo
    level_labels: {flexible: Flexible, standard: Estándar, strict: Estricto}
    manageable_debt:                 # «deuda baja o manejable»: pasa con deuda/patrimonio ≤ max O cobertura de intereses ≥ min
      max_debt_to_equity: 0.5
      min_interest_coverage: 3.0
    presets:                         # botones del bloque de solvencia del scanner (rellenan los selectores y escanean; ninguno activo por defecto)
      - { name: "Caja (4 filtros)", levels: { q_ocfd: standard, q_capex: standard, q_bb: strict, q_fcfa: strict } }
      - { name: "Deuda sana",       levels: { q_de: standard, q_cash: standard, q_cov: standard } }
      # opcional: manageable_debt: true marca también «deuda baja o manejable»
    # sectores a los que NO se mide el pasivo, la solvencia ni el flujo de caja (pasan sin medirse): trozos del nombre
    exempt_sectors: [financ, energy, utilit, material, real estate]
  catalog_margin_pct: 5    # puntos de más por arriba y por abajo que se GUARDAN (el rango cotizado sigue al precio)
  candidates:              # rango visible y cotizado, respecto al precio actual
    strike_below_pct_min: 10   # strikes desde un 10 % ...
    strike_below_pct_max: 30   # ... hasta un 30 % por debajo del precio
    dte_min: 1
    dte_max: 35                # vencimientos hasta 35 días
  price_reference:         # precio de venta con el que se calcula el yield
    mode: bid_plus_spread      # bid | mid | bid_plus_spread
    spread_pct: 25             # X: % del spread sumado al bid (0 = bid, 50 = mid)
  initial:                 # valores iniciales del filtro del scanner (todos editables en el formulario)
    strike_below_pct_min: 10   # descuento mínimo del strike (%)
    strike_below_pct_max: 30   # descuento máximo del strike (%)
    min_annual_yield_pct: 12.0   # yield anualizado mínimo (prima / strike × 365 / DTE)
    dte_min: 1
    dte_max: 35
  presets:                 # botones del scanner que cargan estos valores y escanean (dte_max null = máximo de candidates)
    - { name: "Corto plazo", strike_below_pct_min: 10, dte_min: 1, dte_max: 15, min_annual_yield_pct: 20 }
    - { name: "Largo plazo", strike_below_pct_min: 20, dte_min: 16, dte_max: null, min_annual_yield_pct: 13 }
  filters:                       # null = filtro desactivado
    min_bid: 0.01                  # bid mínimo en $: un bid de 0 no se puede vender (y infla el yield con el precio mid)
    min_oi: null
    min_bid_size: null
    max_spread_pct: null
    min_iv_rank: null
    min_iv_percentile: null
  technical:                     # filtros de tendencia, soporte y días desde el último toque (sus valores se eligen en el formulario)
    trend_pivot_width: 3           # método «máximos y mínimos»: días a cada lado de un máximo/mínimo local
    trend_swings_required: 3       # y cuántos de los últimos deben ser crecientes (o decrecientes)
    trend_min_progress_pct: 5      # avance mínimo desde el mínimo (o máximo) sin romper
    trend_durations: [7, 14, 21, 30, 60, 90, 120, 180, 270, 365]   # antigüedad mínima de ese mínimo (días)
    trend_windows_months: [1, 2, 3, 6, 9, 12, 18, 24]  # ventana de la tendencia: últimos N meses de cierres
    support_lookback_days: 365
    support_band_pct: 1.5
    support_min_touches: 3
    support_min_clusters: 2
    support_cluster_gap_days: 20
    support_pivot_width: 3
    ma_slope_candles: 5            # pendiente de una media: se compara con su valor de hace N velas (días, semanas o meses según las velas elegidas)
    chart_months: 24               # gráfico del strike: meses de cierres mensuales
    chart_near_pct: 5              # y % por encima del strike que se marca en amarillo (cerca del strike)
    touch_min_days_options: [10, 20, 30, 45, 60, 90, 120, 180, 252, 365]
  filter_values:                 # valores de las cajas de los filtros opcionales cuando están desmarcados
    min_bid: 0.01
    min_oi: 100
    min_bid_size: 20
    max_spread_pct: 35
    min_iv_rank: 30
    min_iv_percentile: 50

risk:
  cushion_thresholds:
    normal_above: 40     # > 40 verde; 30-40 ámbar; < 30 rojo
    concern_above: 30

diversification:
  weeks_ahead: 5

vix:
  history_days: 5
  futures_ahead: 3

# Credenciales OAuth de tastytrade (solo lectura): de ahí salen IV Rank e IV Percentile (obligatorias).
tastytrade:
  client_secret: ""
  refresh_token: ""
  price_max_deviation_pct: 5   # si el precio de IBKR se aleja más de este % del de tastytrade, se usa el de tastytrade

# De dónde salen la cadena, las cotizaciones de opciones, los precios de los subyacentes y los ex-dividendos.
# La cuenta, las posiciones, el margen what-if, el sector y el VIX son siempre de IBKR.
#   tastytrade: DXLink; mucho más rápido (sin validar contratos uno a uno) y sin límites de TWS. Si falla, cae a IBKR.
#   El VIX y sus futuros también salen de tastytrade (con IBKR de respaldo).
#   ibkr: todo por TWS (comportamiento anterior; versión guardada en la etiqueta git «version-ibkr-datos»).
market_data:
  source: tastytrade
  quote_wait_seconds: 20     # espera máxima por lote de cotizaciones
  settle_seconds: 3          # sin datos nuevos durante tanto tiempo, el lote se da por terminado
  quote_batch_size: 2500     # contratos por conexión DXLink y por petición de cotizaciones (probado: 3000 sí, 4000 no)
  listing_ttl_minutes: 30    # cuánto se reutiliza la lista de contratos de un ticker

# SEC EDGAR (gratuito y oficial): balance y flujo de caja para los filtros de apalancamiento y caja.
# La SEC exige un contacto en las peticiones: pon aquí tu correo (se envía a la SEC en el User-Agent).
# Sin contacto no se consulta y esos filtros no tienen datos.
edgar:
  contact: ""                  # p. ej. "Tu Nombre tu.correo@ejemplo.com"
  refresh_days: 14             # los informes son trimestrales
  requests_per_second: 5       # la SEC permite 10 como máximo

# Histórico de cierres diarios (tastytrade) en el que se basan los filtros técnicos del scanner.
trend:
  history_days: 1400
  batch_timeout_seconds: 20

storage:
  path: data/app.db

market:                    # fuera de este horario solo se refrescan cartera y VIX (tras una captura al cerrar)
  timezone: America/New_York
  open: "09:30"            # entre comillas
  close: "16:00"
  holidays: [2026-11-26, 2026-12-25]   # festivos de EE. UU. (a mano); los cierres anticipados no se modelan
  pause_when_closed: true  # false = refrescar siempre

logging:
  level: INFO
  ib_async_level: WARNING  # INFO escribe una línea por cada actualización de la cartera
  tastytrade_level: WARNING  # el SDK de tastytrade se pone solo en DEBUG y escribe cada mensaje DXLink (llena el log)
  file: logs/scanner.log   # además de la consola; null = solo consola (rotación: file_max_mb x file_backups)
  file_max_mb: 5
  file_backups: 3
