# Copiar a config/config.yaml y ajustar. Ningún valor de negocio está en el código.
ibkr:
  host: 127.0.0.1
  ports: { live: 7496, paper: 7497, gateway_live: 4001, gateway_paper: 4002 }   # TWS y IB Gateway (puertos por defecto de cada uno)
  client_id: 1
  accounts: { live: null, paper: null }   # id por modo (U1234567); imprescindible si TWS gestiona varias cuentas
  auto_detect_mode: true   # al arrancar elige plataforma y live/paper según el puerto que responda (TWS 7496/7497, IB Gateway 4001/4002); false = usa `platform` y `mode`
  platform: tws          # tws | gateway (se prefiere si responden varios)
  mode: paper            # paper | live
  reconnect_interval_seconds: 30   # si TWS está caído (o se cae), se reintenta la conexión cada tanto; la parte de tastytrade no se repite
  what_if_timeout_seconds: 15   # tiempo máximo de un what-if de margen (si TWS pierde la conexión con IBKR no responde nunca)
  market_data_type: 2    # 1 = live, 2 = congelado (live; con el mercado cerrado, el último bid/ask del cierre), 3 = diferido
                         # (3 no ocupa la suscripción en tiempo real: la app móvil de IBKR conserva sus datos en vivo)
  delayed_minutes: 15    # retraso de los datos diferidos (solo con market_data_type 3 o 4)

refresh:
  interval_minutes: 5    # con datos diferidos se usa como mínimo delayed_minutes (no hay datos nuevos antes)
  batch_size: 50             # contratos por petición de cotizaciones a IBKR (también en el respaldo; con tastytrade manda market_data.quote_batch_size)
  account_interval_minutes: 1   # cada cuánto se refrescan cuenta, posiciones y VIX, aparte del ciclo de mercado
  margin_max_age_minutes: 60   # reutiliza el margen (what-if) guardado hasta esta edad
  # El bid size de tastytrade es 5-10 veces menor que el de TWS: con el mercado abierto y TWS conectado se piden a TWS los de los contratos
  # que pasan los demás filtros pero tienen menos de scanner.filter_values.min_bid_size
  tws_bid_size: true
  tws_bid_size_max_age_minutes: 15   # un tamaño de TWS se reutiliza hasta esta edad
  tws_bid_size_max_contracts: 600    # tope por ciclo (primero los de mayor yield anualizado); ~4 s por cada 50

daily_update:
  run_on_startup: true   # sin hora fija (Q-09); se ejecuta en segundo plano tras el primer refresco
  concurrency: 4         # tickers que se actualizan a la vez

scanner:
  spreads:                 # modo «Spread» del scanner (put vendida + put comprada del mismo vencimiento con strike inferior)
    width_options: [1, 2.5, 5, 10, 15, 20]        # anchos que se prueban todos (strike vendido − comprado, en $)
    max_combo_spread_pct: 15                # spread bid/ask del combo (vendida − comprada) máximo, en % del crédito
    min_long_oi: 10                         # pata comprada: OI mínimo
    max_long_spread_pct: 25                 # pata comprada: spread bid/ask máximo (%); sin bid no pasa
    min_credit_usd: 30                      # crédito neto mínimo por spread ($ por contrato)
    min_return_on_risk_pct: 25              # retorno mínimo hasta el vencimiento sobre el riesgo (crédito / pérdida máxima), sin anualizar
    max_loss_nlv_pct: 2                     # pérdida máxima del spread como % del NLV
    # usd_per_base: 1.17                    # dólares por euro, solo si IBKR no da el tipo de cambio
  quality:                 # opciones del bloque «Calidad de la empresa» del scanner
    liquidity_options: [2, 3, 4]            # liquidez mínima de las opciones (1-5, de tastytrade)
    positive_quarters_options: [2, 3, 4]    # trimestres con beneficios exigidos de los últimos 4
    refresh_days: 7                         # cada cuántos días se baja de nuevo el historial trimestral
    metrics_ready_utc: "10:15"              # tastytrade recalcula EPS, capitalización y liquidez una vez al día (10:00-10:10 UTC): no se piden antes del siguiente recálculo
    leverage_options: [1, 2, 3, 5]          # pasivo/patrimonio máximo ofrecido (los sectores exentos no se miden)
    # Filtros de solvencia del Universo con TRES GRADOS de exigencia (flexible, estándar, estricto); el umbral de cada grado:
    thresholds:
      debt_to_equity:     {flexible: 1.5,  standard: 1.0,  strict: 0.5}    # deuda financiera / patrimonio, máximo
      interest_coverage:  {flexible: 2.0,  standard: 3.0,  strict: 5.0}    # resultado operativo / intereses, mínimo (veces)
      cash_to_short_debt: {flexible: 0.5,  standard: 1.0,  strict: 2.0}    # efectivo / deuda a corto plazo, mínimo (veces)
      ocf_to_debt:        {flexible: 0.15, standard: 0.30, strict: 0.50}   # flujo operativo / deuda total, mínimo
      capex_to_ocf:       {flexible: 0.60, standard: 0.35, strict: 0.20}   # inversión / flujo operativo, máximo
      fcf_to_assets:      {flexible: 0.04, standard: 0.08, strict: 0.12}   # flujo de caja libre / activos, mínimo
      net_buyback_pct:    {flexible: 0.0,  standard: 1.0,  strict: 2.0}    # reducción del nº de acciones (%), mínimo
      roic:               {flexible: 0.08, standard: 0.12, strict: 0.20}   # ROIC = resultado operativo tras impuestos / (deuda + patrimonio), mínimo (SUPOSICIÓN: el vídeo no da umbral)
      loss_years:         {flexible: 2,    standard: 1,    strict: 0}      # años con pérdidas de los últimos 10 años fiscales, máximo
      revenue_drops:      {flexible: 2,    standard: 1,    strict: 0}      # años con caída de ingresos de los últimos 10 años fiscales, máximo
      earnings_volatility: {flexible: 0.80, standard: 0.50, strict: 0.30}  # desviación típica del crecimiento anual del beneficio neto, máximo (SUPOSICIÓN calibrada con EDGAR)
    level_labels: {flexible: Flexible, standard: Estándar, strict: Estricto}
    manageable_debt:                 # «deuda baja o manejable»: pasa con deuda/patrimonio ≤ max O cobertura de intereses ≥ min
      max_debt_to_equity: 0.5
      min_interest_coverage: 3.0
    presets:                         # botones del bloque de solvencia del scanner (rellenan los selectores y escanean; ninguno activo por defecto)
      - { name: "Caja (4 filtros)", levels: { q_ocfd: standard, q_capex: standard, q_bb: strict, q_fcfa: strict } }
      - { name: "Deuda sana",       levels: { q_de: standard, q_cash: standard, q_cov: standard } }
      # opcional: manageable_debt: true marca también «deuda baja o manejable»
    # sectores a los que NO se mide el pasivo, la solvencia ni el flujo de caja (pasan sin medirse): trozos del nombre
    exempt_sectors: [financ, energy, utilit, material, real estate]
  catalog_margin_pct: 5    # puntos de más por arriba y por abajo que se GUARDAN (el rango cotizado sigue al precio)
  candidates:              # rango visible y cotizado, respecto al precio actual
    strike_below_pct_min: 5    # strikes desde un 5 % ... (la estrategia de venta de puts trabaja con deltas 0,20–0,30, cerca del precio)
    strike_below_pct_max: 40   # ... hasta un 40 % por debajo del precio (las patas compradas de los spreads de ancho 15–20 $ caen más abajo)
    dte_min: 1
    dte_max: 45                # vencimientos hasta 45 días (la estrategia usa 30–45)
  min_bid: 0.01            # bid mínimo en $ que SIEMPRE se exige (no es un filtro opcional): con bid 0 la put no se puede vender y su ask infla el yield
  price_reference:         # precio de venta con el que se calcula el yield
    mode: bid_plus_spread      # bid | mid | bid_plus_spread
    spread_pct: 25             # X: % del spread sumado al bid (0 = bid, 50 = mid)
  initial:                 # valores iniciales del filtro del scanner (todos editables en el formulario)
    strike_below_pct_min: 10   # descuento mínimo del strike (%)
    strike_below_pct_max: 30   # descuento máximo del strike (%)
    min_yield_pct: 1.0    # yield mínimo del periodo, sin anualizar (prima / strike hasta el vencimiento; el 1 % de TPC)
    dte_min: 1
    dte_max: 35
  presets:                 # perfiles TPC: botones del scanner que cargan estos valores y escanean (dte_max null = máximo de candidates)
    # min_yield_pct: yield mínimo del periodo (prima / strike hasta el vencimiento), no anualizado
    - { name: "Mensual (TPC)", strike_below_pct_min: 20, dte_min: 25, dte_max: 35, min_yield_pct: 1 }
    - { name: "Táctico (TPC)", strike_below_pct_min: 10, dte_min: 10, dte_max: 14, min_yield_pct: 1 }
  filters:                       # null = filtro desactivado
    min_oi: null
    min_bid_size: null
    max_spread_pct: null
    min_iv_rank: null
    min_iv_percentile: null
    min_put_credit: null           # crédito mínimo de la put desnuda ($ por contrato, con el precio de venta de referencia)
    max_capital_risk_pct: null     # capital en riesgo máximo de la put desnuda, (strike − prima) × multiplicador en % del NLV
  technical:                     # filtros de tendencia, soporte y días desde el último toque (sus valores se eligen en el formulario)
    trend_pivot_width: 3           # método «máximos y mínimos»: días a cada lado de un máximo/mínimo local
    trend_swings_required: 3       # y cuántos de los últimos deben ser crecientes (o decrecientes)
    trend_min_progress_pct: 5      # avance mínimo desde el mínimo (o máximo) sin romper
    trend_durations: [7, 14, 21, 30, 60, 90, 120, 180, 270, 365]   # antigüedad mínima de ese mínimo (días)
    trend_windows_months: [1, 2, 3, 6, 9, 12, 18, 24]  # ventana de la tendencia: últimos N meses de cierres
    support_lookback_days: 365
    support_band_pct: 1.5
    support_min_touches: 3
    support_min_clusters: 2
    support_cluster_gap_days: 20
    support_pivot_width: 3
    ma_slope_candles: 5            # pendiente de una media: se compara con su valor de hace N velas (días, semanas o meses según las velas elegidas)
    chart_months: 24               # gráfico del strike: meses de cierres mensuales
    chart_near_pct: 5              # y % por encima del strike que se marca en amarillo (cerca del strike)
    touch_min_days_options: [10, 20, 30, 45, 60, 90, 120, 180, 252, 365]
  filter_values:                 # valores de las cajas de los filtros opcionales cuando están desmarcados
    min_oi: 100
    min_bid_size: 20
    max_spread_pct: 35
    min_iv_rank: 30
    min_iv_percentile: 50
    min_put_credit: 30             # los perfiles TPC y TastyPut lo cargan marcado (scanner.presets[].min_credit_usd / scanner.strategy.min_credit_usd)
    max_capital_risk_pct: 10       # valor de la caja «Capital en riesgo» (% del NLV)

risk:
  cushion_thresholds:
    normal_above: 40     # > 40 verde; 30-40 ámbar; < 30 rojo
    concern_above: 30

diversification:
  weeks_ahead: 5

management:                # tarjeta «Gestión de puts vendidas» del Panel (avisos, nunca órdenes)
  take_profit_pct: 50        # Tastytrade: recoger beneficios al capturar este % de la prima (inicio del rango 50–65 %)
  take_profit_max_pct: 65    # Tastytrade: fin del rango; por encima se avisa de que ya no hay que esperar
  review_dte: 21             # Tastytrade: a este DTE sin llegar al objetivo, cerrar o rolar
  spread_stop_value_multiple: 2   # spreads (Tastytrade): aviso de stop cuando el spread vale N veces el crédito cobrado
  pin_dte: 5                 # spreads: riesgo de pin en los últimos N días ...
  pin_buffer_pct: 2          # ... si el precio está a menos de este % por encima del strike vendido
  max_total_risk_pct: 50     # riesgo total abierto (pérdida máxima de spreads + capital de puts desnudas) sobre el NLV: aviso por encima
  near_strike_pct: 2         # aviso cuando el precio está a menos de este % por encima del strike
  warn_position_pct: 5       # Tastytrade: peso por acción tras asignación (aviso) ...
  max_position_pct: 10       # ... y alerta
  default_profile: tpc       # perfil de cada put mientras no elijas otro en el Panel: tpc | tastytrade
  tpc_close_capture_pct: 90  # TPC (mantener hasta el vencimiento, sin rolar): aviso de que casi toda la prima está ganada
  tpc_warn_position_pct: 10  # TPC: peso por acción tras asignación (el método usa un techo del 15 %)
  tpc_max_position_pct: 15

vix:
  history_days: 5
  futures_ahead: 3

# Credenciales OAuth de tastytrade (solo lectura): de ahí salen IV Rank e IV Percentile (obligatorias).
tastytrade:
  client_secret: ""
  refresh_token: ""
  price_max_deviation_pct: 5   # si el precio de IBKR se aleja más de este % del de tastytrade, se usa el de tastytrade

# De dónde salen la cadena, las cotizaciones de opciones, los precios de los subyacentes y los ex-dividendos.
# La cuenta, las posiciones, el margen what-if, el sector y el VIX son siempre de IBKR.
#   tastytrade: DXLink; mucho más rápido (sin validar contratos uno a uno) y sin límites de TWS. Si falla, cae a IBKR.
#   El VIX y sus futuros también salen de tastytrade (con IBKR de respaldo).
#   ibkr: todo por TWS (comportamiento anterior; versión guardada en la etiqueta git «version-ibkr-datos»).
market_data:
  source: tastytrade
  quote_wait_seconds: 20     # espera máxima por lote de cotizaciones
  settle_seconds: 3          # sin datos nuevos durante tanto tiempo, el lote se da por terminado
  quote_batch_size: 2500     # contratos por conexión DXLink y por petición de cotizaciones (probado: 3000 sí, 4000 no)
  listing_ttl_minutes: 30    # cuánto se reutiliza la lista de contratos de un ticker

# SEC EDGAR (gratuito y oficial): balance y flujo de caja para los filtros de apalancamiento y caja.
# La SEC exige un contacto en las peticiones: pon aquí tu correo (se envía a la SEC en el User-Agent).
# Sin contacto no se consulta y esos filtros no tienen datos.
edgar:
  contact: ""                  # p. ej. "Tu Nombre tu.correo@ejemplo.com"
  refresh_days: 14             # los informes son trimestrales
  requests_per_second: 5       # la SEC permite 10 como máximo

# Histórico de cierres diarios (tastytrade) en el que se basan los filtros técnicos del scanner.
trend:
  history_days: 1400
  batch_timeout_seconds: 20

# Comunidad de traders de Tortuga Trades: un JSON que deja la rutina diaria scripts/actualizar_comunidad.ps1 (se programa con
# scripts/programar_comunidad.ps1). Los trades llegan con un día de retraso (IBKR Flex): sirven para ideas y consenso, no como señal.
community:
  path: data/community/tortuga.json
  openings_path: data/community/aperturas.json   # fecha exacta de apertura de tus puts vendidas (scripts/actualizar_aperturas.ps1); sin él, la primera vez que la app las ve
  source_name: Tortuga       # fuente del Universo con los tickers más vendidos por la comunidad
  universe_top: 40           # cuántos tickers entran en esa fuente (los de más traders en 30 días)
  min_traders: 3             # traders mínimos en 30 días para entrar
  stale_hours: 72            # horas sin rutina a partir de las cuales se avisa

# Tortuga Trades desde la aplicación: la propia app llama una vez al día a la CLI de Claude (`claude -p`, solo lectura) para leer el conector
# de Tortuga (comunidad, tus aperturas y cierres y el radar de Bull Put Spreads). Hace falta la CLI `claude` con la sesión iniciada.
# Los valores por defecto sirven; esto solo documenta lo que se puede cambiar.
# tortuga:
#   enabled: true
#   model: sonnet
#   times: {aperturas: "11:10", comunidad: "11:15", radar_spreads: "11:45"}   # hora local de cada rutina
#   intervals: {radar_spreads: 30}   # rutinas que se repiten cada N minutos mientras la app está abierta y el mercado abierto (más una pasada tras el cierre)
#   source_name: TortugaSpreads    # fuente del Universo con los valores del radar que cumplen el yield del perfil 
#   puts_source_name: TortugaPuts  # fuente con los del radar cuya estrategia propuesta es la venta de put
#   profile: TastyPut              # perfil del Scanner cuyo yield del periodo se exige a la put de 30Δ del radar
# Listas públicas de tastytrade como fuentes del Universo (se releen cada hora en días hábiles; NO añaden nada a la watchlist). Dividend Champions
# va a puts (barra de calidad); las demás son listas de tastytrade. Su tipo de uso lo deciden los filtros de cada perfil del Scanner.
# tasty_lists:
#   enabled: true
#   refresh_minutes: 60
#   sources:
#     - {list: "Dividend Champions", name: DividendChampions}
#     - {list: "tasty Hourly Top Equities", name: TastyHourly}
#     - {list: "tasty Fast Movers", name: TastyFastMovers}
#     - {list: "tasty default", name: TastyDefault}
#     - {list: "Liquid Symbols", name: TastyLiquid}
#     - {list: "tasty IVR", name: TastyIVR}
#     - {list: "Tom's Watchlist", name: TastyTom}
# Super Investors (13F) de gestores de calidad y valor: fuente de empresas de calidad para puts (rutina semanal con la CLI de Claude).
# super_investors:
#   enabled: true
#   source_name: SuperInvestors
#   managers: [buffett, fundsmith, akre, sequoia, yacktman, pabrai, himalaya, russo, dodgecox, harris, firsteagle, tweedy, weitz, brave, southeastern]
#   min_weight_pct: 2.0            # peso mínimo en la cartera 13F del gestor
#   min_managers: 1                # gestores que la tienen con ese peso
# scanner.quality.put_floor: {enabled: true, require_profitable: true, min_positive_quarters: 3, require_positive_fcf: true}   # calidad mínima de toda put desnuda
# scanner:
#   quality:
#     etf_index_symbols: [SPY, QQQ, IWM, ...]   # ETF e índices: exentos de beneficios, trimestres, deuda y solvencia

storage:
  path: data/app.db

market:                    # fuera de este horario solo se refrescan cartera y VIX (tras una captura al cerrar)
  timezone: America/New_York
  open: "09:30"            # entre comillas
  close: "16:00"
  holidays: [2026-11-26, 2026-12-25]   # festivos de EE. UU. (a mano); los cierres anticipados no se modelan
  pause_when_closed: true  # false = refrescar siempre
  premarket_open: "04:00"  # desde aquí hasta la apertura solo se actualizan los precios de los subyacentes (tastytrade)
  premarket_prices: true   # false = antes de abrir los precios se quedan en el cierre anterior
  premarket_open: "04:00"  # desde aquí hasta la apertura solo se actualizan los precios de los subyacentes (tastytrade)
  premarket_prices: true   # false = antes de abrir los precios se quedan en el cierre anterior

logging:
  level: INFO
  ib_async_level: WARNING  # INFO escribe una línea por cada actualización de la cartera
  tastytrade_level: WARNING  # el SDK de tastytrade se pone solo en DEBUG y escribe cada mensaje DXLink (llena el log)
  file: logs/scanner.log   # además de la consola; null = solo consola (rotación: file_max_mb x file_backups)
  file_max_mb: 5
  file_backups: 3

# Noticias de cada empresa (tooltip del ticker). Clave gratuita en https://finnhub.io (60 peticiones/minuto). Sin clave solo sale la descripción.
finnhub:
  api_token: ""

# Subyacentes que no son acciones de EE. UU. en USD (índices): cadena, cotizaciones, precio y margen salen de TWS y los cierres diarios de Yahoo.
# El Euro Stoxx 50 viene por defecto (opciones OESX de Eurex, en euros, multiplicador 10); para usarlo hay que añadir ESTX50 a la watchlist.
# TWS no da datos de Eurex en tiempo real sin suscripción: la app abre una segunda conexión (clientId + ibkr.instruments_client_offset) con datos
# diferidos y completa el último bid/ask con la principal. Sin esta sección se usan los valores por defecto; `instruments: {}` los desactiva.
# instruments:
#   ESTX50: { symbol: ESTX50, exchange: EUREX, currency: EUR, multiplier: 10, trading_class: OESX, yahoo_symbol: "^STOXX50E", sector: Índice Europa }

# Escaneo automático de perfiles: registra cuándo aparece cada contrato (o spread) en un perfil y cuándo deja de salir (con el filtro que lo descarta).
# Solo evalúa los tickers cuyo mercado está abierto (EE. UU., o el horario propio de ESTX50 y los valores europeos).
# scan_log:
#   enabled: true
#   interval_minutes: 15
#   profiles: []              # nombres de perfiles del Scanner; vacío = todos (menos el de las puts que no encajan)
#   sheets:                   # opcional: volcado a Google Sheets (cuenta de servicio + `pip install gspread`)
#     enabled: false
#     spreadsheet_id: ""      # trozo de la URL entre /d/ y /edit; comparte la hoja con el email de la cuenta de servicio (editor)
#     credentials_file: config/google-credentials.json
#     auth: service_account   # o `oauth` (tu cuenta de Google; si tu organización bloquea las claves de cuentas de servicio):
#     oauth_client_file: config/google-oauth-client.json   #   ID de cliente OAuth de tipo «Aplicación de escritorio»
#     oauth_token_file: config/google-oauth-token.json     #   se crea al ejecutar `python -m scanner_opciones.jobs.scan_log_sheets`
