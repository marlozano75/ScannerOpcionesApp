<style>
  .msgs { display:flex; flex-wrap:wrap; align-items:flex-start; gap:5px; margin-bottom:10px; max-height:30vh; overflow:auto; }
  .msg { --c:#555; --c-bg:#eee; --c-line:#ddd; display:inline-flex; flex-wrap:wrap; align-items:center; gap:2px 8px; max-width:100%; padding:2px 10px; border-radius:999px; border:1px solid var(--c-line); background:var(--c-bg); font-size:12px; line-height:1.5; }
  .msg summary { display:inline-flex; gap:8px; align-items:center; cursor:pointer; list-style:none; } .msg summary::-webkit-details-marker { display:none; }
  .msg summary::before { content:"▸"; color:var(--c); font-size:10px; } .msg[open] summary::before { content:"▾"; }
  .msg[open] { border-radius:10px; padding:4px 10px 6px; flex-basis:100%; }
  .msg .mt { font-weight:700; color:var(--c); }
  .msg .mi { display:flex; flex-wrap:wrap; gap:3px; flex-basis:100%; margin-top:4px; }
  .msg .mi code { padding:0 7px; border-radius:999px; background:#fff; border:1px solid var(--c-line); color:var(--ink); font-size:11px; }
  .msg .mn { color:var(--mute); }
  .msg.ok { --c:#1f7a5c; --c-bg:#e6f4ee; --c-line:#b7dccd; }
  .msg.del { --c:#b3361b; --c-bg:#fbebe7; --c-line:#ecb5ad; }
  .msg.skip { --c:#5d6678; --c-bg:#eef0f4; --c-line:#d3d8e2; }
  .msg.warn { --c:#9a6700; --c-bg:#fcf3dc; --c-line:#ecd593; }
  .msg.err { --c:#a01d1d; --c-bg:#f9e3df; --c-line:#e3a29a; }
  .msg.info { --c:#3b4a8a; --c-bg:#e8eaf3; --c-line:#c5cbe0; }
</style>
{% if groups %}<div class="msgs">{% for g in groups %}
  {%- if g.chips %}<details class="msg {{ g.kind }}"><summary><span class="mt">{{ g.title }}</span><span class="mn">{{ g.chips|length }}{{ ' · ' ~ g.note if g.note }}</span></summary>
    <span class="mi">{% for it in g.chips %}<code>{{ it }}</code>{% endfor %}</span></details>
  {%- else %}<div class="msg {{ g.kind }}">{% if g.title %}<span class="mt">{{ g.title }}</span>{% endif %}{% if g.note %}<span class="mn">{{ g.note }}</span>{% endif %}</div>{% endif %}{% endfor %}</div>{% endif %}
