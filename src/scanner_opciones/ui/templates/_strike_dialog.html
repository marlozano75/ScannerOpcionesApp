{# Gráfico del strike en una ventana: se abre al pulsar un `a.chart-link` (data-ticker, data-strike). Mismo gráfico que el Scanner (`/chart/strike`). #}
<style>
  .chart-link { color:inherit; text-decoration:none; border-bottom:1px dotted var(--mute); cursor:pointer; }
  .chart-link:hover { border-bottom-style:solid; color:var(--accent); }
  .sh-dialog { border:1px solid var(--line-strong); border-radius:14px; background:var(--panel); color:var(--ink); padding:16px 20px 20px; width:min(820px, 94vw); }
  .sh-dialog::backdrop { background:rgba(31,45,74,.45); }
  .sh-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-head h2 { margin:0; }
  .sh-head button { font-size:22px; line-height:1; padding:2px 10px; background:transparent; color:var(--mute); border:0; cursor:pointer; }
  .sh-banner { border-radius:8px; padding:8px 12px; margin-bottom:6px; border:1px solid; }
  .sh-banner.ok { background:#e3f3e8; border-color:#7fc59a; color:#1d6b3f; }
  .sh-banner.warn { background:#fbeed2; border-color:#e3b85a; color:#8a5a00; }
  .sh-touch { margin:0 0 8px; padding:6px 12px; border-left:3px solid #e87a1e; background:var(--field); }
  .sh-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--mute); margin-bottom:4px; }
  .sh-legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:5px; vertical-align:-1px; }
  .sh-legend span.dash::before { width:16px; height:0; border-radius:0; background:none; border-top:2px dashed var(--c); vertical-align:3px; }
  .sh-legend span.ring::before { background:none; border:2px solid var(--c); }
  .sh-tog { cursor:pointer; color:var(--c); font-weight:700; }
  .sh-tog input { accent-color:var(--c); vertical-align:-2px; }
  .sh-svg .sh-ma.off { display:none; }
  .sh-svg { width:100%; height:auto; color:var(--ink); display:block; }
</style>
<dialog id="strike-dialog" class="sh-dialog">
  <div class="sh-head"><h2 id="strike-title">Historial de cierres</h2><button type="button" id="strike-close" aria-label="Cerrar">×</button></div>
  <div id="strike-body"></div>
</dialog>
<script>
  (function () {
    const dlg = document.getElementById('strike-dialog');
    const body = document.getElementById('strike-body'), title = document.getElementById('strike-title');
    document.addEventListener('click', function (e) {
      const a = e.target.closest('a.chart-link');
      if (!a) return;
      e.preventDefault();
      title.textContent = a.dataset.ticker + ' · strike $' + Number(a.dataset.strike).toLocaleString('en-US') + (a.dataset.long ? ' / $' + Number(a.dataset.long).toLocaleString('en-US') : '');
      body.innerHTML = '<p class="muted">Cargando…</p>';
      if (!dlg.open) dlg.showModal();
      fetch('/chart/strike?ticker=' + encodeURIComponent(a.dataset.ticker) + '&strike=' + encodeURIComponent(a.dataset.strike) + (a.dataset.long ? '&long=' + encodeURIComponent(a.dataset.long) : ''))
        .then(function (r) { return r.text(); })
        .then(function (html) { body.innerHTML = html; applyMa(); })
        .catch(function () { body.innerHTML = '<p class="muted">No se pudo cargar el gráfico.</p>'; });
    });
    const maOff = function () { try { return JSON.parse(sessionStorage.getItem('strike-ma-off') || '[]'); } catch (e) { return []; } };
    function applyMa() {
      const off = maOff();
      body.querySelectorAll('input[data-ma]').forEach(function (c) {
        c.checked = off.indexOf(c.dataset.ma) < 0;
        body.querySelectorAll('.sh-ma.' + c.dataset.ma).forEach(function (g) { g.classList.toggle('off', !c.checked); });
      });
    }
    body.addEventListener('change', function (e) {
      const c = e.target.closest('input[data-ma]');
      if (!c) return;
      const off = maOff().filter(function (k) { return k !== c.dataset.ma; });
      if (!c.checked) off.push(c.dataset.ma);
      try { sessionStorage.setItem('strike-ma-off', JSON.stringify(off)); } catch (err) { /* sin almacenamiento */ }
      applyMa();
    });
    document.getElementById('strike-close').addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });   // clic fuera de la ventana
  })();
</script>
