[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-opciones"
version = "0.1.0"
description = "Scanner de opciones y panel de riesgo para IBKR (Reg T)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "ib_async>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["manual: requiere TWS/IB Gateway en ejecucion (excluido por defecto)"]
addopts = "-m \"not manual\""

[tool.setuptools.package-data]
scanner_opciones = ["ui/templates/*.html"]
